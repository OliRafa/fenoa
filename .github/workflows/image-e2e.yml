name: Image e2e

# Builds the image from source, runs the container smoke tests, and validates a real
# `bootc install to-disk` (composefs-native + systemd-boot — the shipping bootloader) by
# loopback-mounting the installed disk. aarch64 runner because the image is Apple-Silicon /
# Fedora Asahi only.
#
# Not covered here (needs a real Mac): the physical boot and first-boot service execution — the
# Asahi kernel won't boot in generic qemu. That's the on-hardware images/boottest/ harness.
on:
  push:
    paths:
      - 'images/**'
      - 'system/**'
      - 'packages/**'
      - 'deploy/**'
      - 'Brewfile'
      - '.github/workflows/image-e2e.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'system/**'
      - 'packages/**'
      - 'deploy/**'
      - 'Brewfile'
      - '.github/workflows/image-e2e.yml'
  schedule:
    - cron: '0 6 * * 1'   # weekly: base-image, kernel and security updates; publish.yml follows on success
  workflow_dispatch:

concurrency:
  group: image-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk (image builds + bootc install-to-disk are space-hungry)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install podman + disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman btrfs-progs dosfstools gdisk

      # Rootful podman throughout: `bootc install` reads the image from /var/lib/containers, so the
      # image must be built into root storage (sudo) and the scripts run under sudo.
      - name: Build the platform stage (bootc container lint runs in-build)
        run: sudo env ENGINE=podman ./images/build.sh platform

      - name: Platform smoke test
        run: sudo env ENGINE=podman ./images/fenoa/hack/platform-smoke.sh fenoa-platform:44

      - name: First-boot user e2e (platform)
        run: sudo env ENGINE=podman ./images/fenoa/hack/first-boot.sh fenoa-platform:44

      - name: Build the desktop image (FROM the platform stage, reusing its layers)
        run: sudo env ENGINE=podman ./images/build.sh fenoa

      - name: Platform smoke test (desktop image)
        run: sudo env ENGINE=podman ./images/fenoa/hack/platform-smoke.sh fenoa:44

      # Exercises the shipped configuration with the real binaries in the image: Noctalia validates
      # the seeded config, Hyprland verifies the Lua config, the greeter lists its default session.
      - name: Desktop smoke test
        run: sudo env ENGINE=podman ./images/fenoa/hack/desktop-smoke.sh fenoa:44

      - name: First-boot user e2e (desktop — skel seeds the session config)
        run: sudo env ENGINE=podman DESKTOP=1 ./images/fenoa/hack/first-boot.sh fenoa:44

      - name: bootc install to-disk (composefs + systemd-boot) + deploy assertions
        run: sudo env ENGINE=podman ./images/fenoa/hack/install-to-disk.sh fenoa:44 "$RUNNER_TEMP/out"

      # Real-bootc proxy for the install wrapper: `bootc install to-filesystem` onto a loopback disk
      # whose ESP is pre-populated like a real Asahi ESP. Proves esp_backup/esp_restore preserve the
      # preboot layer around an ACTUAL install. The work dir must be a real directory inside the
      # image (/home is a symlink to /var/home there), hence /var/tmp.
      - name: bootc install to-filesystem — ESP preboot preservation (real bootc)
        run: |
          sudo rm -rf "$RUNNER_TEMP/out"   # the install-to-disk step ran as root
          sudo env ENGINE=podman bash deploy/tests/esp-bootc-integration.sh fenoa:44 /var/tmp/esp-int

      # The platform stage is no longer needed; reclaim its tag before the next build.
      - name: Drop the platform stage tag
        run: sudo podman rmi fenoa-platform:44 || true

      # fairydust: FROM fenoa, with the stock kernel-16k swapped for the experimental fairydust kernel
      # (a prebuilt context image from ghcr — no kernel compile here) and the initramfs rebuilt.
      - name: Build the fairydust variant (kernel swap + initramfs rebuild)
        run: sudo env ENGINE=podman ./images/build.sh fairydust

      - name: Fairydust smoke test
        run: sudo env ENGINE=podman ./images/fairydust/hack/smoke.sh fenoa-fairydust:44

      - name: Platform + desktop smoke (fairydust image)
        run: |
          sudo env ENGINE=podman KERNEL=fairydust ./images/fenoa/hack/platform-smoke.sh fenoa-fairydust:44
          sudo env ENGINE=podman ./images/fenoa/hack/desktop-smoke.sh fenoa-fairydust:44

      - name: Build the on-hardware boot-test overlay
        run: sudo podman build -t fenoa:44-boottest --build-arg BASE=fenoa:44 -f images/boottest/Containerfile .
