name: Image e2e

# Builds the image from source, runs the container smoke tests, and validates a real
# `bootc install to-disk` (composefs-native + systemd-boot — the shipping bootloader) by
# loopback-mounting the installed disk. x86_64 runner: main is the x86_64 stream (the asahi branch
# builds Apple Silicon on an arm64 runner).
#
# Not covered here: the physical boot and first-boot service execution. That's the
# images/boottest/ harness, on a PC or in a UEFI VM.
on:
  push:
    paths:
      - 'images/**'
      - 'system/**'
      - 'packages/**'
      - 'Brewfile'
      - '.github/workflows/image-e2e.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'system/**'
      - 'packages/**'
      - 'Brewfile'
      - '.github/workflows/image-e2e.yml'
  schedule:
    - cron: '0 6 * * 1'   # weekly: base-image, kernel and security updates; publish.yml follows on success
  workflow_dispatch:

# A newer push supersedes the run in progress, except on a stream branch (main, asahi): there the run
# ends in a publish, which must not be cut off halfway, so a newer run waits for it instead.
concurrency:
  group: image-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/asahi' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk (image builds + bootc install-to-disk are space-hungry)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install podman + disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman btrfs-progs dosfstools gdisk fdisk jq

      # Rootful podman throughout: `bootc install` reads the image from /var/lib/containers, so the
      # image must be built into root storage (sudo) and the scripts run under sudo.
      - name: Build the platform stage (bootc container lint runs in-build)
        run: sudo env ENGINE=podman ./images/build.sh platform

      - name: Platform smoke test
        run: sudo env ENGINE=podman ./images/fenoa/hack/platform-smoke.sh fenoa-platform:44

      - name: First-boot user e2e (platform)
        run: sudo env ENGINE=podman ./images/fenoa/hack/first-boot.sh fenoa-platform:44

      - name: Build the desktop image (FROM the platform stage, reusing its layers)
        run: sudo env ENGINE=podman ./images/build.sh fenoa

      - name: Platform smoke test (desktop image)
        run: sudo env ENGINE=podman ./images/fenoa/hack/platform-smoke.sh fenoa:44

      # Exercises the shipped configuration with the real binaries in the image: Noctalia validates
      # the seeded config, Hyprland verifies the Lua config, the greeter lists its default session.
      - name: Desktop smoke test
        run: sudo env ENGINE=podman ./images/fenoa/hack/desktop-smoke.sh fenoa:44

      - name: First-boot user e2e (desktop — skel seeds the session config)
        run: sudo env ENGINE=podman DESKTOP=1 ./images/fenoa/hack/first-boot.sh fenoa:44

      - name: bootc install to-disk (composefs + systemd-boot) + deploy assertions
        run: sudo env ENGINE=podman ./images/fenoa/hack/install-to-disk.sh fenoa:44 "$RUNNER_TEMP/out"

      # The platform stage is no longer needed; reclaim its tag before the next build.
      - name: Drop the platform stage tag
        run: sudo podman rmi fenoa-platform:44 || true

      - name: Build the boot-test overlay
        run: sudo podman build -t fenoa:44-boottest --build-arg BASE=fenoa:44 -f images/boottest/Containerfile .

  # The asahi branch's weekly run. GitHub runs schedules only on the default branch, so this one
  # starts it there; that run publishes the Apple Silicon image like a push does.
  asahi-weekly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Image e2e on the asahi branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run image-e2e.yml --repo "$GITHUB_REPOSITORY" --ref asahi

  # Publish what e2e just tested, from a stream branch (main: x86_64, asahi: Apple Silicon) and never
  # for a pull request. GitHub runs scheduled and workflow_run workflows only from the default branch,
  # so the asahi branch could not chain a separate publish workflow; calling it here works on both.
  publish:
    needs: e2e
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/asahi')
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
