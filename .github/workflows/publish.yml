name: Publish images (GHCR)

# Release the images that "Image e2e" just tested: e2e pushes fenoa and fenoa-fairydust as the
# immutable :44-<sha> tags once install-to-disk, first boot and every smoke test have passed, and
# calls this with their digests, for a push to a stream branch, its weekly run or a manual run of it
# (never a pull request). This tags those digests, cosign-signs them (keyless, via GitHub OIDC) and
# rebuilds the multi-arch index, so what machines pull is byte for byte what e2e tested, with no
# second build. This is the Apple Silicon stream (main publishes x86_64's).
#
# fenoa is one multi-arch name: each stream publishes its own architecture's image under an arch tag
# and then points fenoa:44 and :latest at an index of the newest image of each (images/publish-index.sh),
# so bootc on any machine pulls fenoa:44 and gets its own.
#
#   ghcr.io/<owner>/fenoa:44             index of :44-amd64 and :44-arm64
#   ghcr.io/<owner>/fenoa:44-arm64       this stream's image (Hyprland + Noctalia, stock Asahi kernel-16k)
#   ghcr.io/<owner>/fenoa-fairydust:44   the same with the fairydust kernel, FROM fenoa (arm64 only)
#
# Also :44-<shortsha> (immutable, this stream's images) and :latest (fenoa: the index;
# fenoa-fairydust: its image). The platform stage is built as part of fenoa and never pushed on its own.
on:
  workflow_call:
    inputs:
      digest:
        description: Digest of the fenoa image Image e2e tested and pushed as fenoa:44-<sha>
        required: true
        type: string
      fairydust_digest:
        description: Digest of the fenoa-fairydust image Image e2e tested and pushed as fenoa-fairydust:44-<sha>
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless (Fulcio/Rekor via GitHub OIDC)

jobs:
  publish:
    # Only this branch's stream publishes from it.
    if: github.ref == 'refs/heads/asahi'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      FEDORA: "44"
      ARCH: arm64
      DIGEST: ${{ inputs.digest }}
      FD_DIGEST: ${{ inputs.fairydust_digest }}
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Same repository, so a copy moves no layers: it writes the tested manifest under the new tag,
      # and --preserve-digests fails it rather than let the digest change.
      - name: Tag the tested images
        id: push
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          fenoa="ghcr.io/$owner/fenoa" fd="ghcr.io/$owner/fenoa-fairydust"
          promote() {          # promote <repo> <digest> <tag>...
            local repo="$1" digest="$2" arch t
            shift 2
            [[ $digest == sha256:* ]] || { echo "Image e2e handed over no digest for $repo: '$digest'"; exit 1; }
            arch="$(skopeo inspect --format '{{.Architecture}}' "docker://$repo@$digest")"
            [[ $arch == "$ARCH" ]] || { echo "$repo@$digest is $arch, not $ARCH"; exit 1; }
            for t in "$@"; do skopeo copy --preserve-digests "docker://$repo@$digest" "docker://$repo:$t"; done
          }
          # fenoa:$FEDORA and :latest are the multi-arch index, rebuilt by the index job below.
          promote "$fenoa" "$DIGEST" "$FEDORA-$ARCH"
          promote "$fd" "$FD_DIGEST" "$FEDORA" latest
          {
            echo "fenoa_ref=$fenoa@$DIGEST"
            echo "fd_ref=$fd@$FD_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the images (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          # cosign (go-containerregistry) reads the docker config, not skopeo's auth.json.
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign "${{ steps.push.outputs.fenoa_ref }}"
          cosign sign "${{ steps.push.outputs.fd_ref }}"

      - name: Summary
        run: |
          {
            echo "### Published + signed"
            echo ""
            echo "- \`${{ steps.push.outputs.fenoa_ref }}\` (\`$FEDORA-$ARCH\`, \`$FEDORA-${GITHUB_SHA::12}\`)"
            echo "- \`${{ steps.push.outputs.fd_ref }}\` (\`$FEDORA\`, \`$FEDORA-${GITHUB_SHA::12}\`, \`latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Point fenoa:44 and :latest at the newest image of each architecture. Both streams' runs queue on
  # one group, so two indexes are never assembled at once; a run still pending when a newer one
  # queues is cancelled, which loses nothing, since the newer run reads the same tags after it.
  index:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish-fenoa-index
      cancel-in-progress: false
    env:
      FEDORA: "44"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install podman and skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble the multi-arch index
        id: index
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fenoa"
          ./images/publish-index.sh "$repo" "$FEDORA" index.digest
          echo "ref=$repo@$(cat index.digest)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the index (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign "${{ steps.index.outputs.ref }}"

      - name: Summary
        run: |
          {
            echo "### Index"
            echo ""
            echo "- \`${{ steps.index.outputs.ref }}\` (\`$FEDORA\`, \`latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"
