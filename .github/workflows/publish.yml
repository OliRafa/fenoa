name: Publish images (GHCR)

# Build the fenoa bootc image, smoke-test it, push it to GHCR so `bootc install` / `bootc switch` /
# `bootc upgrade` have something to pull, then cosign-sign it (keyless, via GitHub OIDC). x86_64
# runner: main is the x86_64 stream (the asahi branch publishes Apple Silicon's).
#
# fenoa is one multi-arch name: each stream publishes its own architecture's image under an arch tag
# and then points fenoa:44 and :latest at an index of the newest image of each (images/publish-index.sh),
# so bootc on any machine pulls fenoa:44 and gets its own.
#
#   ghcr.io/<owner>/fenoa:44             index of :44-amd64 and :44-arm64
#   ghcr.io/<owner>/fenoa:44-amd64       this stream's image (Hyprland + Noctalia, x86_64)
#
# Also :44-<shortsha> (immutable, this stream's image) and :latest (the index). The platform stage is
# built as part of fenoa and never pushed on its own.
#
# "Image e2e" calls this once install-to-disk, first boot and every smoke test have passed, for a
# push to a stream branch, its weekly run or a manual run, never for a pull request; so it builds
# exactly the commit e2e tested, and repeats the smoke tests on its own build before pushing anything.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless (Fulcio/Rekor via GitHub OIDC)

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      FEDORA: "44"
      ARCH: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Compute image refs (GHCR requires a lowercase namespace)
        id: refs
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "fenoa=ghcr.io/$owner/fenoa"
            sha="${{ github.sha }}"
            echo "sha=${sha::12}"
          } >> "$GITHUB_OUTPUT"

      - name: Free up runner disk (image builds are space-hungry)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman

      # Rootless throughout: we only build, smoke-test and push, so no root container storage is
      # needed and cosign/podman share the runner user's registry auth.
      - name: Build fenoa
        run: env ENGINE=podman FEDORA="$FEDORA" ./images/build.sh fenoa

      - name: Smoke-test fenoa (never publish an image that fails them)
        run: |
          ./images/fenoa/hack/platform-smoke.sh "fenoa:$FEDORA"
          ./images/fenoa/hack/desktop-smoke.sh "fenoa:$FEDORA"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag, push, and record digests
        id: push
        run: |
          set -euo pipefail
          fenoa="${{ steps.refs.outputs.fenoa }}"
          sha="${{ steps.refs.outputs.sha }}"
          push_tags() {          # push_tags <local> <remote-repo> <digestfile> <tag>...
            local local_tag="$1" repo="$2" df="$3" t
            shift 3
            for t in "$@"; do podman tag "$local_tag" "$repo:$t"; done
            # A single push of the first tag writes the digest; the alias tags share it.
            podman push "$repo:$1" --digestfile "$df"
            for t in "${@:2}"; do podman push "$repo:$t"; done
            echo "  pushed $repo (digest $(cat "$df"))"
          }
          # fenoa:$FEDORA and :latest are the multi-arch index, rebuilt by the index job below.
          push_tags "fenoa:$FEDORA"           "$fenoa" fenoa.digest "$FEDORA-$ARCH" "$FEDORA-$sha"
          echo "fenoa_ref=$fenoa@$(cat fenoa.digest)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          # cosign (go-containerregistry) reads the docker config, not podman's auth.json.
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign "${{ steps.push.outputs.fenoa_ref }}"

      - name: Summary
        run: |
          {
            echo "### Published + signed"
            echo ""
            echo "- \`${{ steps.push.outputs.fenoa_ref }}\` (\`$FEDORA-$ARCH\`, \`$FEDORA-${{ steps.refs.outputs.sha }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Point fenoa:44 and :latest at the newest image of each architecture. Both streams' runs queue on
  # one group, so two indexes are never assembled at once; a run still pending when a newer one
  # queues is cancelled, which loses nothing, since the newer run reads the same tags after it.
  index:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish-fenoa-index
      cancel-in-progress: false
    env:
      FEDORA: "44"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install podman and skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble the multi-arch index
        id: index
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fenoa"
          ./images/publish-index.sh "$repo" "$FEDORA" index.digest
          echo "ref=$repo@$(cat index.digest)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the index (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign "${{ steps.index.outputs.ref }}"

      - name: Summary
        run: |
          {
            echo "### Index"
            echo ""
            echo "- \`${{ steps.index.outputs.ref }}\` (\`$FEDORA\`, \`latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"
