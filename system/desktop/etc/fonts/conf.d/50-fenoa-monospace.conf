<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Source Code Pro is Fenoa's monospace font. Anything that asks for "monospace" gets it: foot, the
  Noctalia shell and greeter (font_family = "monospace"), editors and Qt/GTK monospace text.
  prepend_first + strong puts it ahead of the preferences other font packages register for
  monospace. Change it per user in ~/.config/fontconfig/fonts.conf with the same rule.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Source Code Pro</string>
    </edit>
  </match>
</fontconfig>
