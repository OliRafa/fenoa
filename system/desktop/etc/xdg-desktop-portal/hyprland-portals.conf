# Portal routing for the Hyprland session. xdg-desktop-portal searches /etc/xdg-desktop-portal before
# /usr/share/xdg-desktop-portal and uses the first hyprland-portals.conf it finds on its own, so this
# file replaces xdg-desktop-portal-hyprland's copy whole and has to repeat its default= line.
#
# gnome-keyring's portal declares UseIn=gnome, so under Hyprland no Secret portal is picked and
# Flatpak apps cannot keep secrets in the keyring the login unlocks. Name it explicitly.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
