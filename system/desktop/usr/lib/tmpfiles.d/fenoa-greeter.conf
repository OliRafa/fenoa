# noctalia-greeter keeps its state in /var/lib/noctalia-greeter: greeter.toml (admin config),
# sync.toml and the wallpapers Noctalia's appearance sync installs, and the last session/scheme
# picked on the login screen. It must exist, mode 0750, owned by greetd's greeter account, or the
# greeter comes up blank. The package ships no tmpfiles entry and /var is only seeded on first boot,
# so create it here. The account is "greetd" on Fedora (see /etc/greetd/config.toml).
d /var/lib/noctalia-greeter 0750 greetd greetd -

# The declarative config is part of the image: link it in (L+ re-asserts the link every boot) so
# image updates reach it. Sync and the login UI never write greeter.toml.
L+ /var/lib/noctalia-greeter/greeter.toml - - - - /usr/share/fenoa/greeter/greeter.toml
