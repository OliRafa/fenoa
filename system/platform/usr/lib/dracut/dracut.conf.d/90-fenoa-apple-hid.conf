# Load the Apple HID drivers from the initramfs. Otherwise the internal keyboard/trackpad (SPI on M1
# 13" laptops, DockChannel MTP on M2 and later) first binds to hid-generic and is re-created once hid_apple / hid_magicmouse
# load from the root filesystem, reshuffling /dev/input/eventN while logind and the compositor are
# starting. logind's TakeDevice then fails ("Could not take device: No such file or directory"),
# libinput never retries, and the trackpad is dead for the whole session. See docs/asahi.md.
force_drivers+=" hid_apple hid_magicmouse "
