# Apple keyboards: top row sends media keys (brightness, volume, playback) by default and F1-F12
# with Fn held — the macOS behaviour the Hyprland bindings assume. Read when hid_apple loads, which
# is from the initramfs (dracut.conf.d/90-fenoa-apple-hid.conf), so this file must be in the image
# before the initramfs is rebuilt.
options hid_apple fnmode=1
