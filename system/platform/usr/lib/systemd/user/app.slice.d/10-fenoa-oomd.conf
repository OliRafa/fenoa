# Make user apps the only thing systemd-oomd is allowed to kill.
#
# Hyprland runs in session.slice (wayland-wm@hyprland.desktop.service under uwsm), while apps the
# shell launches go through `uwsm-app` (Noctalia's launch_apps_custom_command) and land in
# app.slice/app-*.scope. Marking only app.slice as a kill candidate means the compositor and the
# shell are structurally ineligible: oomd takes the browser or terminal that caused the pressure,
# and the session survives to show the notification about it.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
