# Without an OOM daemon there is nothing between "memory is tight" and "processes start dying at
# random". The kernel OOM killer only fires once an allocation has already failed outright, which is
# far too late for the desktop: the machine thrashes in reclaim until something fails somewhere
# fatal (seen as the compositor taking SIGBUS from a client's shm pool torn down by the same
# pressure). One app misbehaving should not cost the whole session.
#
# systemd-oomd keys on PSI stall time rather than on free pages, so it acts while the machine is
# still thrashing instead of after an allocation failed. 50% means half of a ten-second window was
# spent stalled on memory reclaim; held for 20s straight, the desktop is already unusable and losing
# one app is the cheaper outcome. Which cgroups are eligible is set separately, in
# /usr/lib/systemd/user/app.slice.d/10-fenoa-oomd.conf.
[OOM]
DefaultMemoryPressureDurationSec=20s
DefaultMemoryPressureLimit=50%
